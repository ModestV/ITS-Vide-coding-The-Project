name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8 safety

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --statistics

      - name: Run unit tests
        run: |
          pytest tests/ --verbose

      - name: Integration test — summarization reduces text length
        run: |
          python <<'EOF'
          from src.summarizer import MultilingualSummarizer

          # English
          text_en = (
              "This is a reasonably long test text to verify that summarization "
              "actually reduces the length of the input. It contains multiple "
              "sentences and key information that should be preserved."
          )
          summary_en = MultilingualSummarizer("en").summarize(text_en, 0.5)
          assert len(summary_en) < len(text_en)
          print("✅ English: OK")

          # Russian
          text_ru = (
              "Это достаточно длинный тестовый текст, чтобы убедиться, что "
              "суммаризация действительно уменьшает длину исходного текста. "
              "Он содержит несколько предложений и ключевую информацию."
          )
          summary_ru = MultilingualSummarizer("ru").summarize(text_ru, 0.5)
          assert len(summary_ru) < len(text_ru)
          print("✅ Russian: OK")

          # German
          text_de = (
              "Dies ist ein ausreichend langer Testtext, um sicherzustellen, "
              "dass die Zusammenfassung действительно уменьшает длину."
          )
          summary_de = MultilingualSummarizer("de").summarize(text_de, 0.5)
          assert len(summary_de) < len(text_de)
          print("✅ German: OK")
          EOF

      - name: Security check (non-blocking)
        continue-on-error: true
        run: |
          safety check
