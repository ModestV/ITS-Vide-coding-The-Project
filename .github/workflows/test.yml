name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest flake8 safety

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --statistics

    - name: Run unit tests
      run: |
        pytest tests/ --verbose

    - name: Integration test — summarization reduces text length
      run: |
        python -c "
from src.summarizer import MultilingualSummarizer

# Тест для английского
text_en = 'This is a reasonably long test text to verify that summarization actually reduces the length of the input. It contains multiple sentences and key information that should be preserved in the summary.'
summarizer_en = MultilingualSummarizer('en')
summary_en = summarizer_en.summarize(text_en, 0.5)
assert len(summary_en) < len(text_en), f'English summarization failed: {len(summary_en)} >= {len(text_en)}'
print('✅ English: OK')

# Тест для русского
text_ru = 'Это достаточно длинный тестовый текст, чтобы убедиться, что суммаризация действительно уменьшает длину исходного текста. Он содержит несколько предложений и ключевую информацию, которая должна сохраниться в резюме.'
summarizer_ru = MultilingualSummarizer('ru')
summary_ru = summarizer_ru.summarize(text_ru, 0.5)
assert len(summary_ru) < len(text_ru), f'Russian summarization failed: {len(summary_ru)} >= {len(text_ru)}'
print('✅ Russian: OK')

# Тест для немецкого
text_de = 'Dies ist ein ausreichend langer Testtext, um sicherzustellen, dass die Zusammenfassung die Länge des Originaltextes tatsächlich reduziert. Er enthält mehrere Sätze und Schlüsselinformationen, die im Fazit erhalten bleiben sollten.'
summarizer_de = MultilingualSummarizer('de')
summary_de = summarizer_de.summarize(text_de, 0.5)
assert len(summary_de) < len(text_de), f'German summarization failed: {len(summary_de)} >= {len(text_de)}'
print('✅ German: OK')
"

    - name: Security check
      run: |
        safety check